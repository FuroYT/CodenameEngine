name: Collect & Release Builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0 or v1.0.1-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Is this a prerelease? true/false'
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create folders
        run: mkdir -p renamed update_assets_temp

      # --------------------
      # WINDOWS ARTIFACTS
      # --------------------
      - name: Download Windows full build artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: windows.yml
          name: Codename Engine
          path: artifacts/windows/full_build

      - name: Download Windows executable artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: windows.yml
          name: Codename Engine (Executable Only)
          path: artifacts/windows/executable

      - name: Rename Windows executable
        run: mv "artifacts/windows/executable/CodenameEngine.exe" "renamed/update-windows.exe"

      - name: Re-zip Windows full build
        run: |
          cd artifacts/windows/full_build
          zip -r ../../../renamed/Codename\ Engine-windows.zip .

      # --------------------
      # MACOS ARTIFACTS
      # --------------------
      - name: Download macOS full build artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: macos.yml
          name: Codename Engine
          path: artifacts/macos/full_build

      - name: Download macOS executable artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: macos.yml
          name: Codename Engine (Executable Only)
          path: artifacts/macos/executable

      - name: Rename macOS executable
        run: mv "artifacts/macos/executable/CodenameEngine" "renamed/update-macos"

      - name: Make macOS executable executable
        run: chmod +x renamed/update-macos

      - name: Re-zip macOS full build
        run: |
          cd artifacts/macos/full_build
          zip -r ../../../renamed/Codename\ Engine-macos.zip .

      # --------------------
      # LINUX ARTIFACTS
      # --------------------
      - name: Download Linux full build artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: linux.yml
          name: Codename Engine
          path: artifacts/linux/full_build

      - name: Download Linux executable artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: linux.yml
          name: Codename Engine (Executable Only)
          path: artifacts/linux/executable

      - name: Rename Linux executable
        run: mv "artifacts/linux/executable/CodenameEngine" "renamed/update-linux"

      - name: Make Linux executable executable
        run: chmod +x renamed/update-linux

      - name: Re-zip Linux full build
        run: |
          cd artifacts/linux/full_build
          zip -r ../../../renamed/Codename\ Engine-linux.zip .

      # --------------------
      # UPDATE-ASSETS.ZIP CREATION
      # --------------------
      - name: Determine release tag for update-assets.zip base
        id: get_base_release
        run: |
          echo "Looking for base release..."
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            LAST_PRERELEASE=$(gh release list --repo ${{ github.repository }} --prerelease --limit 1 --json tagName --jq '.[0].tagName' || echo "")
            if [ -z "$LAST_PRERELEASE" ]; then
              BASE_RELEASE=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
            else
              BASE_RELEASE=$LAST_PRERELEASE
            fi
          else
            BASE_RELEASE=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "base_release=$BASE_RELEASE" >> $GITHUB_OUTPUT

      - name: Download assets from base release
        run: |
          echo "Downloading assets from release ${{ steps.get_base_release.outputs.base_release }}"
          gh release download "${{ steps.get_base_release.outputs.base_release }}" --repo ${{ github.repository }} --pattern "*.zip" -D update_assets_temp

      - name: Extract assets folders from zips
        run: |
          mkdir -p update_assets_temp/extracted_assets
          for f in update_assets_temp/*.zip; do
            unzip -j "$f" 'assets/*' -d update_assets_temp/extracted_assets || true
          done

      - name: Recreate assets folder hierarchy
        run: |
          mkdir -p renamed/assets
          cp -r update_assets_temp/extracted_assets/* renamed/assets/

      - name: Create update-assets.zip
        run: |
          cd renamed
          zip -r update-assets.zip assets/

      # --------------------
      # CREATE RELEASE
      # --------------------
      - name: Create GitHub Release (draft)
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: Release ${{ github.event.inputs.tag_name }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            renamed/Codename Engine-windows.zip
            renamed/update-windows.exe
            renamed/Codename Engine-macos.zip
            renamed/update-macos
            renamed/Codename Engine-linux.zip
            renamed/update-linux
            renamed/update-assets.zip
