name: Collect & Release Builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release name (e.g. v1.0.5 or v1.2-rc1)"
        required: true
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean

jobs:
  collect-release:
    name: Collect & Release Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download Windows full build
      - name: Download Windows Full Build
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: windows.yml
          name: Codename Engine
          path: artifacts/windows/full_build

      # Download Windows executable only
      - name: Download Windows Executable
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: windows.yml
          name: Codename Engine (Executable Only)
          path: artifacts/windows/executable

      # Download macOS full build
      - name: Download macOS Full Build
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: macos.yml
          name: Codename Engine
          path: artifacts/macos/full_build

      # Download macOS executable only
      - name: Download macOS Executable
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: macos.yml
          name: Codename Engine (Executable Only)
          path: artifacts/macos/executable

      # Download Linux full build
      - name: Download Linux Full Build
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: linux.yml
          name: Codename Engine
          path: artifacts/linux/full_build

      # Download Linux executable only
      - name: Download Linux Executable
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: linux.yml
          name: Codename Engine (Executable Only)
          path: artifacts/linux/executable

      # Rename + zip artifacts
      - name: Prepare artifacts
        run: |
          mkdir -p renamed

          # Windows
          mv artifacts/windows/executable/CodenameEngine.exe renamed/update-windows.exe
          zip -r "renamed/Codename Engine-windows.zip" artifacts/windows/full_build

          # macOS
          mv artifacts/macos/executable/CodenameEngine renamed/update-macos
          zip -r "renamed/Codename Engine-macos.zip" artifacts/macos/full_build

          # Linux
          mv artifacts/linux/executable/CodenameEngine renamed/update-linux
          zip -r "renamed/Codename Engine-linux.zip" artifacts/linux/full_build

      # Find base release for assets
      - name: Find Base Release
        id: get_base_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Looking for base release..."
          TAG="${{ github.event.inputs.tag_name }}"

          if [[ "$TAG" == *"-rc"* || "$TAG" == *"-beta"* ]]; then
            # prerelease → fallback to latest stable release
            BASE=$(gh release list --repo ${{ github.repository }} --exclude-pre-releases --json tagName -L 1 -q '.[0].tagName')
          else
            # stable release → latest stable
            BASE=$(gh release list --repo ${{ github.repository }} --exclude-pre-releases --json tagName -L 1 -q '.[0].tagName')
          fi

          echo "Base release: $BASE"
          echo "base_release=$BASE" >> $GITHUB_OUTPUT

      # Download & repackage assets properly
      - name: Prepare update-assets.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p update_assets_temp renamed
          echo "Downloading assets from release ${{ steps.get_base_release.outputs.base_release }}"
          gh release download "${{ steps.get_base_release.outputs.base_release }}" \
            --repo ${{ github.repository }} \
            --pattern "assets.zip" \
            -D update_assets_temp

          unzip -q update_assets_temp/assets.zip -d update_assets_temp
          cd update_assets_temp
          zip -r ../renamed/update-assets.zip assets
          cd ..

      # Create GitHub Release (always draft, prerelease if set)
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: Release ${{ github.event.inputs.tag_name }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}

      # Upload assets to the release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            renamed/Codename Engine-windows.zip
            renamed/update-windows.exe
            renamed/Codename Engine-macos.zip
            renamed/update-macos
            renamed/Codename Engine-linux.zip
            renamed/update-linux
            renamed/update-assets.zip
